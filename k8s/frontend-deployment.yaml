apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ravenveles/frontend:1a1221cdcab6f2ec95ade1ad3212154281ffc3cb
          imagePullPolicy: Always
          ports:
            - containerPort: 80