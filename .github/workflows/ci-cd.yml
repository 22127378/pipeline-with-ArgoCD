name: CI/CD Pipeline for GitOps

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ravenveles/frontend:${{ github.sha }}
            ravenveles/frontend:latest

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ravenveles/backend:${{ github.sha }}
            ravenveles/backend:latest

      - name: Update Kubernetes Manifests (GitOps)
        run: |
          sed -i "s|image: ravenveles/frontend:.*|image: ravenveles/frontend:${{ github.sha }}|g" k8s/frontend-deployment.yaml
          sed -i "s|image: ravenveles/backend:.*|image: ravenveles/backend:${{ github.sha }}|g" k8s/backend-deployment.yaml

      - name: Commit and Push Manifest Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git commit -m "[CONFIG] Update image tags to ${{ github.sha }} [skip ci]" || exit 0
          git push
